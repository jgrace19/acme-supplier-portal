<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in | Acme Mutual Supplier Portal</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body class="login-page" data-auth="none">
<main class="login-main">
  <div class="login-card">
    <div class="brand"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M17 2 L30 7 V16 C30 24 24.5 29.5 17 32 C9.5 29.5 4 24 4 16 V7 Z" fill="#13807A"/><path d="M17 8 L23.5 25 H20.6 L19.2 21 H14.8 L13.4 25 H10.5 Z M15.7 18.5 H18.3 L17 14.6 Z" fill="#fff"/></svg><span>Acme Mutual Supplier Portal<small>Strategic Sourcing and Procurement</small></span></div>
    <h1>Supplier sign in</h1>
    <p class="sub">Sign in to view sourcing events, download documents and submit responses.</p>
    <form id="signin" autocomplete="on" novalidate>
      <label for="username">Email address</label>
      <input type="email" id="username" name="username" autocomplete="username" placeholder="name@company.com" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit" class="btn" id="signin-btn">Sign in</button>
      <div class="error" id="error" role="alert"></div>
    </form>
    <div class="login-links"><a href="#" onclick="return false">Forgot password?</a><a href="#" onclick="return false">Register as a new supplier</a></div>
  </div>
</main>
<div class="login-foot">Access is limited to registered suppliers. Activity may be monitored. <a href="about.html">About Acme Mutual</a></div>
<script src="app.js"></script>
</body>
</html>
